<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>青岛豪华汽车修理部 · 三合一</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        }
        body {
            background: #0a0808;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 14px 12px;
        }
        .app-container {
            max-width: 480px;
            width: 100%;
            background: #13100e;
            border-radius: 40px;
            padding: 22px 16px 30px;
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.95);
            border: 1px solid rgba(255,215,0,0.06);
        }

        /* ===== 导航 ===== */
        .nav-tabs {
            display: flex;
            gap: 6px;
            background: #1c1815;
            padding: 4px;
            border-radius: 60px;
            margin-bottom: 24px;
            border: 1px solid #2e2822;
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 14px 6px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            background: transparent;
            color: #a59784;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-tab i { font-size: 17px; }
        .nav-tab.active {
            background: #f5c542;
            color: #0f0d0b;
            box-shadow: 0 6px 18px rgba(245,197,66,0.25);
        }

        .page { display: none; animation: fadeSlide 0.25s ease; }
        .page.active { display: block; }
        @keyframes fadeSlide {
            0% { opacity: 0.3; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 页面1: 汽车维修介绍 ===== */
        .shop-header {
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #2b2420;
            margin-bottom: 20px;
        }
        .shop-header .icon { font-size: 44px; color: #f5c542; margin-bottom: 6px; }
        .shop-header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7da7a, #dbaa1a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .shop-header .sub { color: #a09582; font-size: 14px; margin-top: 4px; }

        .info-card {
            background: #171412;
            border-radius: 24px;
            padding: 18px 16px;
            border: 1px solid #2b2420;
            margin-bottom: 14px;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #1f1b17;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row i {
            width: 24px;
            color: #f5c542;
            font-size: 18px;
            margin-top: 2px;
            text-align: center;
        }
        .info-row .label { color: #8f8472; font-size: 13px; min-width: 56px; }
        .info-row .value { color: #e8ddcc; font-size: 15px; font-weight: 500; flex: 1; }
        .info-row .value a { color: #e8ddcc; text-decoration: none; }

        .service-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .service-tag {
            background: #221d19;
            border: 1px solid #3d352d;
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            color: #ddd0bc;
        }
        .service-tag i { color: #f5c542; margin-right: 6px; }

        .contact-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 60px;
            background: #1f1b17;
            border: 1px solid #3d352d;
            color: #ddd0bc;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.15s;
        }
        .contact-btn i { color: #f5c542; font-size: 18px; }
        .contact-btn.primary {
            background: linear-gradient(135deg, #e8b82a, #d49f1a);
            border-color: #e8b82a;
            color: #0e0c0a;
        }
        .contact-btn.primary i { color: #0e0c0a; }

        /* ===== 页面2: 预约 ===== */
        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .page-title i { font-size: 26px; color: #f5c542; }
        .page-title h2 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7da7a, #dbaa1a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .booking-form {
            background: #171412;
            border-radius: 28px;
            padding: 22px 18px 26px;
            border: 1px solid #2b2420;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #cbc0ae;
            margin-bottom: 6px;
        }
        .form-group label i { color: #f5c542; margin-right: 8px; width: 20px; }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px 18px;
            border-radius: 60px;
            background: #221d19;
            border: 1px solid #3d352d;
            color: #f0e6da;
            font-size: 16px;
            outline: none;
            min-height: 54px;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #f5c542;
            box-shadow: 0 0 0 3px rgba(245,197,66,0.12);
        }
        .form-group input[type="date"] { color-scheme: dark; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-gold {
            width: 100%;
            background: linear-gradient(135deg, #e8b82a, #d49f1a);
            border: none;
            border-radius: 60px;
            padding: 18px;
            font-weight: 700;
            font-size: 18px;
            color: #0e0c0a;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(245,197,66,0.2);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 58px;
        }
        .btn-gold:active { transform: scale(0.97); }

        .toast-message {
            background: #2f2a1e;
            border-left: 4px solid #f5c542;
            padding: 14px 18px;
            border-radius: 24px;
            font-size: 15px;
            color: #ddd6c8;
            margin-top: 18px;
            display: none;
            align-items: center;
            gap: 12px;
        }
        .toast-message.show { display: flex; }
        .toast-message i { color: #f5c542; font-size: 22px; }

        /* ===== 页面3: 后台管理 ===== */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid #2b2420;
        }
        .admin-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-title i { font-size: 26px; color: #f5c542; }
        .admin-title h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7da7a, #dbaa1a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .admin-badge {
            background: rgba(245,197,66,0.08);
            border: 1px solid rgba(245,197,66,0.15);
            border-radius: 60px;
            padding: 4px 14px;
            font-size: 12px;
            color: #d4c4aa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .admin-badge i { color: #f5c542; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }
        .stat-box {
            background: #1a1714;
            border-radius: 18px;
            padding: 14px 8px;
            border: 1px solid #2b241f;
            text-align: center;
        }
        .stat-box .num {
            font-size: 26px;
            font-weight: 700;
            color: #f5d77b;
            display: block;
            line-height: 1.2;
        }
        .stat-box .label { font-size: 12px; color: #a09582; margin-top: 4px; }
        .stat-box .label i { margin-right: 3px; color: #f5c54266; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .toolbar .left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toolbar .left i { color: #7a6f5e; font-size: 14px; }
        .toolbar .left span { color: #c0b5a2; font-size: 14px; font-weight: 500; }

        .filter-group select {
            background: #221d19;
            border: 1px solid #3d352d;
            color: #e0d4c0;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            min-height: 44px;
        }
        .filter-group select:focus { border-color: #f5c542; }

        .btn-outline {
            background: transparent;
            border: 1px solid #3d352d;
            color: #c0b5a2;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
        }
        .btn-outline:active { border-color: #f5c542; color: #f5d77b; }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #2b2420;
            background: #171412;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 520px;
            font-size: 13px;
        }
        thead {
            background: #1f1b17;
            border-bottom: 1px solid #2f2821;
        }
        thead th {
            text-align: left;
            padding: 14px 12px;
            color: #b5aa97;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid #26201b; }
        tbody tr:last-child { border-bottom: none; }
        tbody td {
            padding: 12px 12px;
            color: #e8ddcc;
            vertical-align: middle;
            font-size: 13px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-badge.pending {
            background: rgba(245,197,66,0.12);
            color: #f5d77b;
            border: 1px solid rgba(245,197,66,0.15);
        }
        .status-badge.confirmed {
            background: rgba(46,204,113,0.12);
            color: #7ddfa0;
            border: 1px solid rgba(46,204,113,0.15);
        }
        .status-badge.completed {
            background: rgba(100,100,110,0.2);
            color: #b0a89a;
            border: 1px solid rgba(200,190,170,0.08);
        }

        /* 操作按钮区域 - 确认、删除、完成 */
        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: #8f8472;
            padding: 6px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 40px;
            min-width: 40px;
            justify-content: center;
        }
        .action-btn:active { background: rgba(245,197,66,0.08); }
        .action-btn:hover { color: #f5c542; }
        .action-btn.danger:active { background: rgba(224,107,107,0.1); }
        .action-btn.danger:hover { color: #e06b6b; }
        .action-btn i { font-size: 16px; }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #7a6f5e;
            font-size: 15px;
        }
        .empty-state i {
            display: block;
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        .footer-meta {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid #26201b;
            color: #6b6256;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .footer-meta span i { color: #f5c54266; margin-right: 4px; }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .app-container { padding: 16px 12px 24px; border-radius: 32px; }
            .nav-tab { font-size: 13px; padding: 12px 4px; }
            .nav-tab i { font-size: 15px; }
            .page-title h2 { font-size: 19px; }
            .booking-form { padding: 18px 14px 22px; }
            .form-group input, .form-group select { font-size: 15px; padding: 14px 16px; min-height: 50px; }
            .btn-gold { font-size: 16px; padding: 16px; min-height: 54px; }
            .stats-row { gap: 6px; }
            .stat-box .num { font-size: 22px; }
            .stat-box .label { font-size: 11px; }
            .shop-header h1 { font-size: 20px; }
            .info-row .value { font-size: 14px; }
            .contact-btn { font-size: 13px; padding: 12px; }
        }
        @media (max-width: 380px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .stats-row { grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
            .stat-box { padding: 10px 4px; }
            .stat-box .num { font-size: 18px; }
            .contact-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== 导航 ===== -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="pageShop"><i class="fas fa-store"></i> 汽车维修</button>
            <button class="nav-tab" data-page="pageBooking"><i class="fas fa-calendar-check"></i> 预约</button>
            <button class="nav-tab" data-page="pageAdmin"><i class="fas fa-clipboard-list"></i> 后台</button>
        </div>

        <!-- ===== 页面1: 汽车维修介绍 ===== -->
        <div id="pageShop" class="page active">
            <div class="shop-header">
                <div class="icon"><i class="fas fa-crown"></i></div>
                <h1>青岛豪华汽车修理部</h1>
                <div class="sub">— 专修 · 匠心 · 可靠 —</div>
            </div>

            <div class="info-card">
                <div class="info-row">
                    <i class="fas fa-user-tie"></i>
                    <span class="label">联系人</span>
                    <span class="value">冯先生 <span style="color:#8f8472;font-size:13px;font-weight:400;">（技术经理）</span></span>
                </div>
                <div class="info-row">
                    <i class="fas fa-phone"></i>
                    <span class="label">电话</span>
                    <span class="value"><a href="tel:13678865028">136 7886 5028</a></span>
                </div>
                <div class="info-row">
                    <i class="fas fa-clock"></i>
                    <span class="label">营业时间</span>
                    <span class="value">周一至周六 8:00 – 17:00 <span style="color:#8f8472;font-size:13px;font-weight:400;">（周日休息）</span></span>
                </div>
                <div class="info-row">
                    <i class="fas fa-map-pin"></i>
                    <span class="label">地址</span>
                    <span class="value">青岛李沧区旧货交易市场隔壁</span>
                </div>
                <div class="info-row">
                    <i class="fas fa-tools"></i>
                    <span class="label">服务范围</span>
                    <div class="value">
                        <div class="service-tags">
                            <span class="service-tag"><i class="fas fa-paint-roller"></i> 烤漆</span>
                            <span class="service-tag"><i class="fas fa-hammer"></i> 凹陷修复</span>
                            <span class="service-tag"><i class="fas fa-database"></i> 数据修复</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="contact-actions">
                <a href="tel:13678865028" class="contact-btn primary">
                    <i class="fas fa-phone"></i> 立即致电
                </a>
                <a href="#" class="contact-btn" onclick="alert('导航地址：青岛李沧区旧货交易市场隔壁');return false;">
                    <i class="fas fa-location-dot"></i> 导航
                </a>
            </div>

            <div class="footer-meta">
                <span><i class="fas fa-certificate"></i> 专业烤漆 · 凹陷修复 · 数据修复</span>
            </div>
        </div>

        <!-- ===== 页面2: 预约 ===== -->
        <div id="pageBooking" class="page">
            <div class="page-title">
                <i class="fas fa-calendar-plus"></i>
                <h2>预约维修</h2>
            </div>

            <div class="booking-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> 车主姓名</label>
                    <input type="text" placeholder="请输入姓名" id="bookingName">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> 联系电话</label>
                    <input type="tel" placeholder="请输入手机号" id="bookingPhone" inputmode="numeric">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-calendar-day"></i> 日期</label>
                        <input type="date" id="bookingDate">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-clock"></i> 时段</label>
                        <select id="bookingTime">
                            <option>08:00</option>
                            <option>09:30</option>
                            <option selected>11:00</option>
                            <option>13:00</option>
                            <option>14:30</option>
                            <option>16:00</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-car"></i> 服务项目</label>
                    <select id="bookingModel">
                        <option>烤漆服务</option>
                        <option>凹陷修复</option>
                        <option selected>数据修复</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-pen"></i> 备注（选填）</label>
                    <input type="text" placeholder="如：车门凹陷、保险杠划痕" id="bookingNote">
                </div>

                <button class="btn-gold" id="submitBookingBtn">
                    <i class="fas fa-check-circle"></i> 立即预约
                </button>

                <div id="bookingToast" class="toast-message">
                    <i class="fas fa-check-circle"></i>
                    <span>预约已提交！冯先生会与您确认。</span>
                </div>
            </div>

            <div class="footer-meta">
                <span><i class="fas fa-shield"></i> 隐私保障</span>
                <span><i class="fas fa-clock"></i> 周一至周六 8:00-17:00</span>
            </div>
        </div>

        <!-- ===== 页面3: 后台管理 ===== -->
        <div id="pageAdmin" class="page">
            <div class="admin-header">
                <div class="admin-title">
                    <i class="fas fa-clipboard-list"></i>
                    <h2>预约管理</h2>
                </div>
                <div class="admin-badge">
                    <i class="fas fa-sync-alt fa-fw"></i> 实时
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <span class="num" id="totalCount">0</span>
                    <span class="label"><i class="fas fa-calendar-alt"></i> 总预约</span>
                </div>
                <div class="stat-box">
                    <span class="num" id="pendingCount">0</span>
                    <span class="label"><i class="fas fa-clock"></i> 待确认</span>
                </div>
                <div class="stat-box">
                    <span class="num" id="confirmedCount">0</span>
                    <span class="label"><i class="fas fa-check-circle"></i> 已确认</span>
                </div>
            </div>

            <div class="toolbar">
                <div class="left">
                    <i class="fas fa-filter"></i>
                    <span>筛选</span>
                    <div class="filter-group">
                        <select id="statusFilter">
                            <option value="all">全部</option>
                            <option value="待确认">待确认</option>
                            <option value="已确认">已确认</option>
                            <option value="已完成">已完成</option>
                        </select>
                    </div>
                </div>
                <button class="btn-outline" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>车主</th>
                            <th>电话</th>
                            <th>日期/时段</th>
                            <th>服务</th>
                            <th>状态</th>
                            <th style="text-align:center;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTableBody">
                        <tr>
                            <td colspan="6">
                                <div class="empty-state"><i class="fas fa-inbox"></i>暂无预约记录</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="footer-meta">
                <span><i class="fas fa-edit"></i> 点击操作更新状态</span>
                <span><i class="fas fa-database"></i> 共 <span id="rowCount">0</span> 条</span>
            </div>
        </div>

    </div>

    <script>
        (function() {
            // ===== 1. 页面切换 =====
            var pageShop = document.getElementById('pageShop');
            var pageBooking = document.getElementById('pageBooking');
            var pageAdmin = document.getElementById('pageAdmin');
            var tabs = document.querySelectorAll('.nav-tab');

            function switchPage(pageId) {
                pageShop.classList.remove('active');
                pageBooking.classList.remove('active');
                pageAdmin.classList.remove('active');
                if (pageId === 'pageShop') pageShop.classList.add('active');
                else if (pageId === 'pageBooking') pageBooking.classList.add('active');
                else if (pageId === 'pageAdmin') pageAdmin.classList.add('active');

                tabs.forEach(function(tab) {
                    tab.classList.remove('active');
                    if (tab.dataset.page === pageId) tab.classList.add('active');
                });
            }

            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    switchPage(this.dataset.page);
                });
            });

            // ===== 2. 数据管理 =====
            var bookings = [];
            var nextId = 1;

            function initData() {
                bookings = [
                    { id: nextId++, name: '张先生', phone: '138 1111 2222', date: '2026-08-28', time: '09:30',
                        model: '凹陷修复', note: '', status: '待确认' },
                    { id: nextId++, name: '李女士', phone: '139 3333 4444', date: '2026-08-29', time: '11:00',
                        model: '烤漆服务', note: '保险杠划痕', status: '已确认' },
                    { id: nextId++, name: '王先生', phone: '137 5555 6666', date: '2026-08-30', time: '14:30',
                        model: '数据修复', note: '', status: '待确认' },
                ];
                renderTable();
            }

            // ===== 3. 渲染后台表格 =====
            var tbody = document.getElementById('bookingTableBody');
            var totalSpan = document.getElementById('totalCount');
            var pendingSpan = document.getElementById('pendingCount');
            var confirmedSpan = document.getElementById('confirmedCount');
            var rowCountSpan = document.getElementById('rowCount');
            var statusFilter = document.getElementById('statusFilter');

            function renderTable() {
                var filterVal = statusFilter.value;
                var filtered = bookings;
                if (filterVal !== 'all') {
                    filtered = bookings.filter(function(b) { return b.status === filterVal; });
                }

                var total = bookings.length;
                var pending = bookings.filter(function(b) { return b.status === '待确认'; }).length;
                var confirmed = bookings.filter(function(b) { return b.status === '已确认'; }).length;
                totalSpan.textContent = total;
                pendingSpan.textContent = pending;
                confirmedSpan.textContent = confirmed;
                rowCountSpan.textContent = filtered.length;

                if (filtered.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-inbox"></i>暂无预约记录</div></td></tr>';
                    return;
                }

                var html = '';
                filtered.forEach(function(b) {
                    var statusClass = 'pending';
                    if (b.status === '已确认') statusClass = 'confirmed';
                    else if (b.status === '已完成') statusClass = 'completed';

                    html +=
                        '<tr data-id="' + b.id + '">' +
                        '<td><strong>' + b.name + '</strong></td>' +
                        '<td>' + b.phone + '</td>' +
                        '<td>' + b.date + '<br><span style="color:#8f8472;font-size:11px;">' + b.time + '</span></td>' +
                        '<td>' + b.model + (b.note ? '<br><span style="color:#8f8472;font-size:11px;">' + b.note +
                            '</span>' : '') + '</td>' +
                        '<td><span class="status-badge ' + statusClass + '">' + b.status + '</span></td>' +
                        '<td>' +
                        '<div class="action-btns">' +
                        // 确认按钮（保留原有确认功能）
                        '<button class="action-btn" data-action="confirm" title="确认"><i class="fas fa-check"></i></button>' +
                        // 新增删除按钮（放在确认后面）
                        '<button class="action-btn danger" data-action="delete" title="删除"><i class="fas fa-trash-alt"></i></button>' +
                        // 完成按钮
                        '<button class="action-btn" data-action="complete" title="完成"><i class="fas fa-flag-checkered"></i></button>' +
                        '</div>' +
                        '</td>' +
                        '</tr>';
                });

                tbody.innerHTML = html;
            }

            // ===== 4. 提交预约 =====
            var submitBtn = document.getElementById('submitBookingBtn');
            var toast = document.getElementById('bookingToast');

            document.getElementById('bookingDate').value = new Date().toISOString().split('T')[0];

            submitBtn.addEventListener('click', function(e) {
                e.preventDefault();

                var name = document.getElementById('bookingName').value.trim() || '未填';
                var phone = document.getElementById('bookingPhone').value.trim() || '未填';
                var date = document.getElementById('bookingDate').value || new Date().toISOString().split('T')[
                    0];
                var time = document.getElementById('bookingTime').value;
                var model = document.getElementById('bookingModel').value;
                var note = document.getElementById('bookingNote').value.trim() || '';

                bookings.push({
                    id: nextId++,
                    name: name,
                    phone: phone,
                    date: date,
                    time: time,
                    model: model,
                    note: note,
                    status: '待确认'
                });

                toast.classList.add('show');
                setTimeout(function() {
                    toast.classList.remove('show');
                }, 3000);

                document.getElementById('bookingName').value = '';
                document.getElementById('bookingPhone').value = '';
                document.getElementById('bookingNote').value = '';
                document.getElementById('bookingDate').value = new Date().toISOString().split('T')[0];

                renderTable();

                setTimeout(function() {
                    switchPage('pageAdmin');
                }, 1500);
            });

            // ===== 5. 后台操作（确认 / 删除 / 完成） =====
            tbody.addEventListener('click', function(e) {
                var target = e.target.closest('button');
                if (!target) return;

                var action = target.dataset.action;
                var tr = target.closest('tr');
                if (!tr) return;

                var id = parseInt(tr.dataset.id);
                var booking = null;
                for (var i = 0; i < bookings.length; i++) {
                    if (bookings[i].id === id) {
                        booking = bookings[i];
                        break;
                    }
                }
                if (!booking) return;

                // 确认操作
                if (action === 'confirm') {
                    if (booking.status === '已完成') {
                        alert('已完成订单不可再确认');
                        return;
                    }
                    booking.status = '已确认';
                    renderTable();
                }
                // 删除操作（新增）
                else if (action === 'delete') {
                    if (confirm('确认删除 ' + booking.name + ' 的预约吗？')) {
                        var newBookings = [];
                        for (var j = 0; j < bookings.length; j++) {
                            if (bookings[j].id !== id) {
                                newBookings.push(bookings[j]);
                            }
                        }
                        bookings = newBookings;
                        renderTable();
                    }
                }
                // 完成操作
                else if (action === 'complete') {
                    if (booking.status === '已完成') {
                        alert('该订单已完成');
                        return;
                    }
                    booking.status = '已完成';
                    renderTable();
                }
            });

            // ===== 6. 筛选 & 刷新 =====
            statusFilter.addEventListener('change', renderTable);

            document.getElementById('refreshBtn').addEventListener('click', function() {
                renderTable();
            });

            // ===== 7. 初始化 =====
            initData();

        })();
    </script>

</body>
</html>
